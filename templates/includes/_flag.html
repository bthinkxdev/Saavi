{% comment %}Inline flag for a served country. Expects: code. Unknown codes fall back to a code badge.{% endcomment %}
{% if code == "IN" %}<svg class="sv-flag" viewBox="0 0 24 16" width="24" height="16" aria-hidden="true" focusable="false"><rect width="24" height="16" fill="#fff"/><rect width="24" height="5.34" fill="#FF9933"/><rect y="10.66" width="24" height="5.34" fill="#138808"/><circle cx="12" cy="8" r="2.1" fill="none" stroke="#000080" stroke-width=".8"/><circle cx="12" cy="8" r=".5" fill="#000080"/></svg>{% elif code == "AE" %}<svg class="sv-flag" viewBox="0 0 24 16" width="24" height="16" aria-hidden="true" focusable="false"><rect width="24" height="5.34" fill="#00732F"/><rect y="5.33" width="24" height="5.34" fill="#fff"/><rect y="10.66" width="24" height="5.34" fill="#000"/><rect width="6.5" height="16" fill="#FF0000"/></svg>{% else %}<span class="sv-flag sv-flag--code" aria-hidden="true">{{ code }}</span>{% endif %}
